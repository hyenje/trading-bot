<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crypto Trading Bot Dashboard</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/plotly.js/2.35.0/plotly.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, sans-serif;
            background: #0d1117;
            color: #c9d1d9;
            min-height: 100vh;
        }
        .header {
            background: linear-gradient(135deg, #161b22, #1f2937);
            padding: 20px 30px;
            border-bottom: 1px solid #30363d;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .header h1 { color: #58a6ff; font-size: 1.4em; }
        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .header-actions { display: flex; gap: 8px; align-items: center; }
        .status-running { background: #238636; color: white; }
        .status-stopped { background: #da3633; color: white; }
        .status-dry-run { background: #8957e5; color: white; }
        .status-live { background: #fb8500; color: #0d1117; }
        .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
        .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 24px; }
        .card {
            background: #161b22;
            border: 1px solid #30363d;
            border-radius: 12px;
            padding: 20px;
        }
        .card-label { font-size: 0.8em; color: #8b949e; text-transform: uppercase; letter-spacing: 1px; }
        .card-value { font-size: 1.8em; font-weight: 700; margin-top: 8px; }
        .positive { color: #3fb950; }
        .negative { color: #f85149; }
        .neutral { color: #58a6ff; }
        .muted { color: #8b949e; }
        .chart-container { background: #161b22; border: 1px solid #30363d; border-radius: 12px; padding: 20px; margin-bottom: 24px; }
        .section-title { font-size: 1.1em; color: #58a6ff; margin-bottom: 16px; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; padding: 12px; color: #8b949e; border-bottom: 1px solid #30363d; font-size: 0.85em; }
        td { padding: 12px; border-bottom: 1px solid #21262d; font-size: 0.9em; }
        .tag {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.8em;
            font-weight: 600;
        }
        .tag-buy { background: rgba(63,185,80,0.15); color: #3fb950; }
        .tag-sell { background: rgba(248,81,73,0.15); color: #f85149; }
        .tag-hold { background: rgba(88,166,255,0.15); color: #58a6ff; }
        .tag-short { background: rgba(248,81,73,0.15); color: #f85149; }
        .tag-long { background: rgba(63,185,80,0.15); color: #3fb950; }
        .tag-wait-long { background: rgba(63,185,80,0.10); color: #7ee787; }
        .tag-wait-short { background: rgba(248,81,73,0.10); color: #ff7b72; }
        .two-col { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
        .signal-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 24px; }
        .signal-reason { margin-top: 10px; color: #8b949e; line-height: 1.45; font-size: 0.9em; }
        @media (max-width: 900px) {
            .grid { grid-template-columns: repeat(2, 1fr); }
            .signal-grid { grid-template-columns: 1fr; }
            .two-col { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Crypto Trading Bot</h1>
        <div class="header-actions">
            <span class="status-badge" id="mode-status">Loading...</span>
            <span class="status-badge" id="bot-status">Loading...</span>
        </div>
    </div>
    <div class="container">
        <div class="grid">
            <div class="card">
                <div class="card-label">잔고 (USDT)</div>
                <div class="card-value neutral" id="balance">-</div>
            </div>
            <div class="card">
                <div class="card-label" id="pnl-label">일일 수익</div>
                <div class="card-value" id="daily-pnl">-</div>
            </div>
            <div class="card">
                <div class="card-label">보유 포지션</div>
                <div class="card-value neutral" id="positions-count">-</div>
            </div>
            <div class="card">
                <div class="card-label">오늘 거래</div>
                <div class="card-value neutral" id="trades-count">-</div>
            </div>
        </div>

        <div class="chart-container" id="equity-section">
            <div class="section-title">자산 추이</div>
            <div id="equity-chart" style="height: 350px;"></div>
        </div>

        <div class="signal-grid" id="signal-section" style="display:none;">
            <div class="card">
                <div class="card-label">BTC 전략 신호</div>
                <div class="card-value neutral" id="signal-side">-</div>
                <div class="signal-reason" id="signal-reason">-</div>
            </div>
            <div class="card">
                <div class="card-label">추세 방향</div>
                <div class="card-value neutral" id="signal-bias">-</div>
                <div class="signal-reason" id="signal-indicators">-</div>
            </div>
            <div class="card">
                <div class="card-label">신뢰도</div>
                <div class="card-value neutral" id="signal-confidence">-</div>
                <div class="signal-reason" id="signal-updated">-</div>
            </div>
        </div>

        <div class="card" id="recent-signal-card" style="display:none; margin-bottom: 24px;">
            <div class="section-title">최근 롱/숏 신호</div>
            <table>
                <thead><tr><th>시간</th><th>방향</th><th>가격</th><th>신뢰도</th><th>사유</th></tr></thead>
                <tbody id="signals-table"></tbody>
            </table>
        </div>

        <div class="card" id="executor-card" style="display:none; margin-bottom: 24px;">
            <div class="section-title">테스트넷 주문 실행</div>
            <table>
                <thead><tr><th>상태</th><th>시장 상태</th><th>봉 / 전략</th><th>리스크 감시</th><th>보호 주문</th><th>안전장치</th><th>진입 차단</th><th>주문 금액</th><th>레버리지</th><th>리스크</th><th>마지막 실행</th><th>오류</th></tr></thead>
                <tbody id="executor-table"></tbody>
            </table>
            <table style="margin-top: 16px;">
                <thead><tr><th>시간</th><th>동작</th><th>주문 ID</th><th>방향</th><th>가격</th></tr></thead>
                <tbody id="orders-table"></tbody>
            </table>
        </div>

        <div class="two-col">
            <div class="card">
                <div class="section-title">보유 포지션</div>
                <table>
                    <thead><tr><th>심볼</th><th>방향</th><th>진입 / 현재</th><th>수량</th><th>미실현</th><th>SL / TP</th></tr></thead>
                    <tbody id="positions-table"></tbody>
                </table>
            </div>
            <div class="card">
                <div class="section-title">최근 거래</div>
                <table>
                    <thead><tr><th>심볼</th><th>구분</th><th>가격</th><th>수익</th><th>사유</th></tr></thead>
                    <tbody id="trades-table"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        function formatMoney(value) {
            return '$' + Number(value || 0).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });
        }

        function formatAmount(value) {
            return Number(value || 0).toFixed(6);
        }

        function renderEmptyRow(target, colspan, message) {
            target.innerHTML = `<tr><td colspan="${colspan}" style="text-align:center;color:#8b949e;">${message}</td></tr>`;
        }

        function renderPositions(positions) {
            const table = document.getElementById('positions-table');
            table.innerHTML = '';

            if (!positions?.length) {
                renderEmptyRow(table, 6, '포지션 없음');
                return;
            }

            positions.forEach((position) => {
                const side = String(position.side || '').toUpperCase();
                const pnl = Number(position.unrealized_pnl || 0);
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                const pnlPct = Number(position.pnl_pct || 0);
                table.innerHTML += `<tr>
                    <td><b>${position.symbol}</b></td>
                    <td><span class="tag ${side === 'SHORT' ? 'tag-short' : 'tag-long'}">${side || '-'}</span></td>
                    <td>${formatMoney(position.entry_price)} / ${formatMoney(position.mark_price || position.entry_price)}</td>
                    <td>${formatAmount(position.amount)}</td>
                    <td class="${pnlClass}">${formatMoney(pnl)} (${pnlPct.toFixed(2)}%)</td>
                    <td>${formatMoney(position.stop_loss)} / ${formatMoney(position.take_profit)}</td>
                </tr>`;
            });
        }

        function renderTrades(trades) {
            const table = document.getElementById('trades-table');
            table.innerHTML = '';

            if (!trades?.length) {
                renderEmptyRow(table, 5, '거래 없음');
                return;
            }

            trades.slice(-10).reverse().forEach((trade) => {
                const pnl = Number(trade.pnl || 0);
                const pnlClass = pnl >= 0 ? 'positive' : 'negative';
                const isBuy = trade.side === 'buy';
                const tagClass = isBuy ? 'tag-buy' : 'tag-sell';
                const sideLabel = trade.side_label || (isBuy ? '매수' : '청산');

                table.innerHTML += `<tr>
                    <td><b>${trade.symbol}</b></td>
                    <td><span class="tag ${tagClass}">${sideLabel}</span></td>
                    <td>${formatMoney(trade.exit_price || trade.entry_price)}</td>
                    <td class="${pnlClass}">${formatMoney(pnl)}</td>
                    <td>${trade.reason || '-'}</td>
                </tr>`;
            });
        }

        function sideClass(side) {
            if (side === 'LONG') return 'tag-long';
            if (side === 'SHORT') return 'tag-short';
            if (side === 'WAIT_LONG_BIAS') return 'tag-wait-long';
            if (side === 'WAIT_SHORT_BIAS') return 'tag-wait-short';
            return 'tag-hold';
        }

        function sideLabel(side) {
            if (side === 'LONG') return 'LONG';
            if (side === 'SHORT') return 'SHORT';
            if (side === 'WAIT_LONG_BIAS') return 'WAIT_LONG_BIAS';
            if (side === 'WAIT_SHORT_BIAS') return 'WAIT_SHORT_BIAS';
            return 'HOLD';
        }

        function biasLabel(bias) {
            if (bias === 'LONG_BIAS') return 'LONG';
            if (bias === 'SHORT_BIAS') return 'SHORT';
            return 'NEUTRAL';
        }

        function signalDisplaySide(signal) {
            const side = signal.side || 'HOLD';
            if (signal.entry_block_reason) return 'HOLD';
            if (side !== 'HOLD') return side;
            if (signal.bias === 'LONG_BIAS') return 'WAIT_LONG_BIAS';
            if (signal.bias === 'SHORT_BIAS') return 'WAIT_SHORT_BIAS';
            return side;
        }

        function renderLongShortSignal(signal) {
            const section = document.getElementById('signal-section');
            const recentCard = document.getElementById('recent-signal-card');
            if (!signal) {
                section.style.display = 'none';
                recentCard.style.display = 'none';
                return;
            }

            section.style.display = 'grid';
            recentCard.style.display = 'block';

            const side = signalDisplaySide(signal);
            const sideEl = document.getElementById('signal-side');
            sideEl.innerHTML = `<span class="tag ${sideClass(side)}">${sideLabel(side)}</span>`;
            const rawSide = signal.raw_side || signal.side || 'HOLD';
            const blockReason = signal.entry_block_reason || signal.reverse_block_reason || '';
            document.getElementById('signal-reason').textContent =
                blockReason || signal.reason || '-';

            const bias = signal.bias || 'NEUTRAL';
            const regimeSide = signal.regime_side || 'NEUTRAL';
            const biasEl = document.getElementById('signal-bias');
            biasEl.innerHTML =
                `<span class="tag ${sideClass(biasLabel(bias))}">${biasLabel(bias)}</span>` +
                ` <span class="tag ${sideClass(regimeSide)}">${regimeSide}</span>`;
            document.getElementById('signal-indicators').textContent =
                `10m raw ${rawSide} · Price ${formatMoney(signal.price)} · RSI ${Number(signal.rsi || 0).toFixed(1)} · ` +
                `4h slope ${Number(signal.regime_ema_slope || 0).toFixed(2)}`;

            document.getElementById('signal-confidence').textContent =
                `${(Number(signal.confidence || 0) * 100).toFixed(1)}%`;
            document.getElementById('signal-updated').textContent =
                `${signal.symbol || '-'} · entry ${signal.timeframe || '-'} · regime ${signal.regime_timeframe || '-'} · ${signal.updated_at || '-'}`;

            renderSignals(signal.recent_signals || []);
        }

        function renderSignals(signals) {
            const table = document.getElementById('signals-table');
            table.innerHTML = '';

            if (!signals.length) {
                renderEmptyRow(table, 5, '신호 없음');
                return;
            }

            signals.slice(-8).reverse().forEach((signal) => {
                const side = signal.side || 'HOLD';
                table.innerHTML += `<tr>
                    <td class="muted">${signal.time || '-'}</td>
                    <td><span class="tag ${sideClass(side)}">${sideLabel(side)}</span></td>
                    <td>${formatMoney(signal.price)}</td>
                    <td>${(Number(signal.confidence || 0) * 100).toFixed(1)}%</td>
                    <td>${signal.reason || '-'}</td>
                </tr>`;
            });
        }

        function renderExecutor(status) {
            const card = document.getElementById('executor-card');
            if (!status) {
                card.style.display = 'none';
                return;
            }

            card.style.display = 'block';
            const statusTable = document.getElementById('executor-table');
            const ordersTable = document.getElementById('orders-table');
            const protectionCount = Number((status.protection_orders || []).length);
            const safety = status.safety || {};
            const marketState = status.market_state_status || 'unknown';
            const marketClass = marketState === 'ok' ? 'tag-long' : (marketState === 'rate_limited' ? 'tag-short' : 'tag-hold');
            const safetyText = safety.blocked
                ? safety.block_reason
                : `${Number(safety.daily_trade_count || 0)}/${Number(safety.max_daily_trades || 0)}회 · 손실 ${Number(safety.daily_loss_pct || 0).toFixed(2)}% · 연손 ${Number(safety.consecutive_losses || 0)}/${Number(safety.max_consecutive_losses || 0)}`;
            const entryBlock = status.entry_block_reason || '-';
            const reversePolicy = status.reverse_only_when_profitable
                ? `reverse net >= ${formatMoney(status.min_reverse_net_pnl_usdt)}`
                : 'reverse always';
            const lastError = status.last_market_error || status.last_error || '-';
            statusTable.innerHTML = `<tr>
                <td><span class="tag ${status.enabled ? 'tag-long' : 'tag-hold'}">${status.enabled ? 'ON' : 'OFF'}</span></td>
                <td><span class="tag ${marketClass}">${marketState}</span><br><span class="muted">${status.last_market_update_at || '-'}</span></td>
                <td>${status.timeframe || '-'} entry / ${status.regime_timeframe || '-'} regime<br><span class="muted">${Number(status.poll_interval || 0)}s${status.signal_catchup_enabled ? ' · catch-up' : ''}</span></td>
                <td>${Number(status.risk_poll_interval || 0)}s</td>
                <td>${protectionCount}</td>
                <td>${safetyText}</td>
                <td>${entryBlock}</td>
                <td>${formatMoney(status.order_usdt)}</td>
                <td>${Number(status.leverage || 1)}x</td>
                <td>SL ${Number(status.stop_loss_pct || 0).toFixed(2)}% · TP ${Number(status.take_profit_pct || 0).toFixed(2)}%<br><span class="muted">${reversePolicy}</span></td>
                <td>${status.last_action || '-'}</td>
                <td>${lastError}</td>
            </tr>`;

            ordersTable.innerHTML = '';
            const orders = status.orders || [];
            if (!orders.length) {
                renderEmptyRow(ordersTable, 5, '주문 없음');
                return;
            }

            orders.slice(-8).reverse().forEach((order) => {
                const side = order.side || 'HOLD';
                ordersTable.innerHTML += `<tr>
                    <td class="muted">${order.time || '-'}</td>
                    <td>${order.action || '-'}</td>
                    <td>${order.order_id || '-'}</td>
                    <td><span class="tag ${sideClass(side)}">${sideLabel(side)}</span></td>
                    <td>${formatMoney(order.price)}</td>
                </tr>`;
            });
        }

        function renderEquityChart(equityCurve) {
            const section = document.getElementById('equity-section');
            if (!equityCurve?.length) {
                section.style.display = 'none';
                Plotly.purge('equity-chart');
                return;
            }

            section.style.display = 'block';
            Plotly.newPlot('equity-chart', [{
                y: equityCurve,
                type: 'scatter',
                mode: 'lines',
                fill: 'tozeroy',
                line: { color: '#58a6ff', width: 2 },
                fillcolor: 'rgba(88,166,255,0.08)',
            }], {
                paper_bgcolor: 'transparent',
                plot_bgcolor: 'transparent',
                margin: { t: 10, r: 20, b: 40, l: 60 },
                xaxis: { gridcolor: '#21262d', color: '#8b949e' },
                yaxis: { gridcolor: '#21262d', color: '#8b949e', tickprefix: '$' },
                font: { color: '#8b949e' },
            }, { responsive: true, displayModeBar: false });
        }

        function updateDashboard(data) {
            const badge = document.getElementById('bot-status');
            badge.textContent = data.running ? 'Running' : 'Stopped';
            badge.className = 'status-badge ' + (data.running ? 'status-running' : 'status-stopped');

            const modeBadge = document.getElementById('mode-status');
            modeBadge.textContent = data.dry_run ? 'Dry run' : 'Live';
            modeBadge.className = 'status-badge ' + (data.dry_run ? 'status-dry-run' : 'status-live');

            document.getElementById('balance').textContent = formatMoney(data.balance);

            document.getElementById('pnl-label').textContent =
                data.execution_mode ? '미실현 손익' : '일일 수익';
            const pnl = Number(data.daily_pnl || 0);
            const pnlEl = document.getElementById('daily-pnl');
            pnlEl.textContent = (pnl >= 0 ? '+$' : '-$') + Math.abs(pnl).toLocaleString(undefined, {
                minimumFractionDigits: 2,
                maximumFractionDigits: 2,
            });
            pnlEl.className = 'card-value ' + (pnl >= 0 ? 'positive' : 'negative');

            document.getElementById('positions-count').textContent = Number(data.open_positions || 0);
            document.getElementById('trades-count').textContent = Number(data.daily_trades || 0);

            renderPositions(data.positions || []);
            renderTrades(data.recent_trades || []);
            renderEquityChart(data.equity_curve || []);
            renderLongShortSignal(data.long_short_signal);
            renderExecutor(data.executor_status);
        }

        async function fetchData() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                updateDashboard(data);
            } catch (error) {
                console.error('데이터 로드 실패:', error);
            }
        }

        fetchData();
        setInterval(fetchData, 30000);
    </script>
</body>
</html>
